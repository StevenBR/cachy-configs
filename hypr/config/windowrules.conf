# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule {
  name = windowrule-1
  float = on
  match:class = ^(org.pulseaudio.pavucontrol)
}

windowrule {
  name = windowrule-2
  float = on
  match:class = ^()$
  match:title = ^(Picture in picture)$
}

windowrule {
  name = windowrule-3
  float = on
  match:class = ^(xdg-desktop-portal|xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
}

windowrule {
  name = windowrule-4
  float = on
  match:class = ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
}

windowrule {
  name = windowrule-5
  float = on
  match:class = ^(cachyos-hello.desktop)$

}

windowrule {
  name = windowrule-6
  float = on
  match:class = ^(zenity)$
}

# General window rules
windowrule {
  name = windowrule-7
  size = 960 540
  move = ((monitor_w*0.25)-)
  match:title = ^(Picture-in-Picture)$
}

windowrule {
  name = windowrule-8
  float = on
  move = ((monitor_w*0.25)-)
  size = 960 540
  match:title = ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
}

windowrule {
  name = windowrule-9
  pin = on
  match:title = ^(danmufloat)$
}

windowrule {
  name = windowrule-10
  rounding = 5
  match:title = ^(danmufloat|termfloat)$
}

windowrule {
  name = windowrule-13
  tile = on
  match:class = ^(gnome-control-center)$
}

windowrule {
  name = windowrule-14
  tile = on
  match:class = ^(pavucontrol)$
}

windowrule {
  name = windowrule-15
  tile = on
  match:class = ^(nm-connection-editor)$
}


windowrule {
  name = windowrule-16
  float = on
  match:class = ^(gnome-calculator)$
  # match:class = ^(org.gnome.Calculator.desktop)$
}
windowrule {
  name = windowrule-20
  float = on
  match:class = ^(firefox)$
  match:title = ^(Picture-in-Picture)$
}

windowrule {
  name = windowrule-21
  opacity = 0.9 0.9
  match:class = ^(com.system76.CosmicTerm)$
}

