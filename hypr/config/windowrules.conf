#My Custom Rules#########
#my custom layerrule's
# vicinae blur
layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0
  no_anim = on
  match:namespace = vicinae
}


# vicinae disable fade animation for vicinae only
windowrule {
  name = windowrule-25
#open app to window
  workspace = 2
  match:class = ^(steam)
  match:title = Steam
}
