# ┃                    Animations Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# https://wiki.hyprland.org/0.45.0/Configuring/Animations/ 

animations {
#### always keep enabled, self explanatory
    enabled = yes

    animation = windowsIn, 1, 2, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 3, default
    animation = windowsMove, 1, 3, default
    animation = fade, 1, 3, default
    animation = border, 1, 15, default
    #### enable vertical scroll of workspaces
    animation = workspaces, 1, 4, default, slidevert

}
