# ┃                    Decorations Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/colors.conf

# https://wiki.hyprland.org/0.45.0/Configuring/Variables/#decoration
# https://wiki.hyprland.org/0.45.0/Configuring/Variables/#blur
    
general {
    gaps_in = 8
    gaps_out = 5
    border_size = 2
    col.active_border = $stevenhotpink
    col.inactive_border = $cachymblue
    layout = scrolling # master|dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    # inactive_opacity = 0.9


    # https://wiki.hyprland.org/0.45.0/Configuring/Variables/#shadow
    shadow {
        enabled = true
        ### noctalia material shell added
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
            size = 3
            passes = 2
            vibrancy = 0.1696
    }

}
