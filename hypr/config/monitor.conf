# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki https://wiki.hyprland.org/0.45.0/Configuring/Monitors/

# monitor = , preferred, auto, 1,
# monitor =DP-1, 3840x21600@165, auto, 1
monitor =DP-1, 3840x21600@165, auto, 1, bitdepth, 10
# above works grerat for SDR, trying HDR below. turns sdr colors up and saturates them more 
# monitor =DP-1, 3840x21600@165, auto, 1, bitdepth, 10, cm, hdr,sdrbrightness, 1.5
# monitor =DP-1, 3840x21600@165, auto, 1, bitdepth, 10, cm, hdr,sdrbrightness, 1.45
# monitor =DP-1, 3840x21600@165, auto, 1, bitdepth, 10, cm, hdr,sdrbrightness, 1.40,sdrsaturation, 1.2
# monitor =DP-1, 3840x21600@165, auto, 1, bitdepth, 10, cm, hdr, sdrbrightness, 1.45, sdrsaturation, 1.25
# this still uses hdr if a game or something full screen like that uses hdr. remove this if you uncomment the hdr settings above.
render:cm_fs_passthrough = 1

# If you need to scale things like steam etc, please uncomment these lines.
# Adjust GDK_SCALE accordingly to your liking.
